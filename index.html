<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Breathwork, built on the neuroscience. Guided techniques, flows, breath-hold tests and Wren, your coach.">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Second Wind">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>[hidden]{display:none!important}body{margin:0}</style>
<script src="config.js"></script>
<script src="standalone.js"></script>
<title>Second Wind</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;600&display=swap">
<style>
@property --s { syntax: '<number>'; inherits: true; initial-value: 0; }

/* Layout: iOS-style single column — large titles, gradient practice tiles, inset grouped cards, frosted tab bar; practice runs on a full-screen dark stage */
:root {
  --bg: #F2F2F7;
  --card: #FFFFFF;
  --fill: rgba(118,118,128,.12);
  --fill-2: rgba(118,118,128,.22);
  --sep: rgba(60,60,67,.2);
  --fg: #0A0A0D;
  --fg-2: rgba(60,60,67,.66);
  --fg-3: rgba(60,60,67,.34);
  --tint: #0B7E93;
  --tint-2: #2FB58C;
  --tint-soft: rgba(11,126,147,.12);
  --on-tint: #FFFFFF;
  --switch-on: #34C759;
  --warn-soft: rgba(255,149,0,.13);
  --danger: #D70015;
  --brake: #0E8A9E;
  --gas: #D9480F;
  --bal: #5856D6;
  --good: #1E8E3E;
  --logo-l: inline-block;
  --logo-d: none;
  --font-brand: "Hanken Grotesk", -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
  --font-serif: ui-serif, "New York", "Iowan Old Style", Georgia, serif;
  --bar: rgba(247,247,250,.82);
  --shadow: 0 1px 1px rgba(16,24,40,.03), 0 6px 20px rgba(16,24,40,.06);
  --seg-on: #FFFFFF;
  --seg-shadow: 0 3px 8px rgba(0,0,0,.12), 0 1px 1px rgba(0,0,0,.04);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
  --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", system-ui, sans-serif;
  --font-round: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000; --card: #1C1C1E; --fill: rgba(118,118,128,.24); --fill-2: rgba(118,118,128,.36);
    --sep: rgba(84,84,88,.62); --fg: #FFFFFF; --fg-2: rgba(235,235,245,.62); --fg-3: rgba(235,235,245,.3);
    --tint: #4FD1E5; --tint-2: #5BE0A8; --tint-soft: rgba(79,209,229,.16); --on-tint: #00262D;
    --switch-on: #30D158; --warn-soft: rgba(255,159,10,.16); --danger: #FF453A; --brake: #4FD1E5; --gas: #FF9F0A; --bal: #8E8CFF; --good: #30D158; --logo-l: none; --logo-d: inline-block;
    --bar: rgba(22,22,24,.8); --shadow: none; --seg-on: #636366; --seg-shadow: none;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #000000; --card: #1C1C1E; --fill: rgba(118,118,128,.24); --fill-2: rgba(118,118,128,.36);
  --sep: rgba(84,84,88,.62); --fg: #FFFFFF; --fg-2: rgba(235,235,245,.62); --fg-3: rgba(235,235,245,.3);
  --tint: #4FD1E5; --tint-2: #5BE0A8; --tint-soft: rgba(79,209,229,.16); --on-tint: #00262D;
  --switch-on: #30D158; --warn-soft: rgba(255,159,10,.16); --danger: #FF453A; --brake: #4FD1E5; --gas: #FF9F0A; --bal: #8E8CFF; --good: #30D158; --logo-l: none; --logo-d: inline-block;
  --bar: rgba(22,22,24,.8); --shadow: none; --seg-on: #636366; --seg-shadow: none;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--fg);
  font: 400 17px/1.35 var(--font); letter-spacing: -0.01em;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
  padding-inline: 16px;
}
html.staged body { overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; text-align: inherit; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--tint); outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }
svg { display: block; }

.app { max-width: 620px; margin: 0 auto; padding-block: 6px calc(112px + env(safe-area-inset-bottom, 0px)); }

/* Navigation header */
.nav { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding-top: 14px; margin-bottom: 18px; }
.eyebrow { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--fg-2); }
.large { font: 700 34px/1.12 var(--font-display); letter-spacing: .01em; margin-top: 2px; text-wrap: balance; }
.icon-btn { width: 36px; height: 36px; border-radius: 50%; background: var(--fill); display: grid; place-items: center; color: var(--tint); flex: none; margin-bottom: 4px; }
.icon-btn svg { width: 20px; height: 20px; }

/* Suggested hero */
.hero { position: relative; display: block; width: 100%; min-height: 196px; border-radius: 24px; overflow: hidden; color: #fff; background: linear-gradient(135deg, var(--c1), var(--c2)); box-shadow: var(--shadow); padding: 20px 148px 20px 20px; isolation: isolate; transition: transform .2s; }
.hero:active, .tile:active, .tcard:active, .today:active { transform: scale(.98); }
.hero::after, .tile::after, .sh-hero::after { content: ""; position: absolute; inset: 0; z-index: -1; background: radial-gradient(120% 90% at 100% 0%, rgba(255,255,255,.26), transparent 55%), radial-gradient(90% 80% at 0% 100%, rgba(0,0,0,.16), transparent 60%); }
.hero-copy { position: relative; z-index: 1; display: flex; flex-direction: column; gap: 4px; min-height: 156px; }
.hero-eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; opacity: .86; }
.hero-title { font: 700 27px/1.12 var(--font-display); text-wrap: balance; }
.hero-sub { font-size: 15px; opacity: .92; max-width: 26ch; }
.hero-cta { margin-top: auto; align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,.96); color: #111; font-weight: 600; font-size: 15px; padding: 8px 14px 8px 12px; border-radius: 999px; font-variant-numeric: tabular-nums; }
.hero-cta svg { width: 14px; height: 14px; }
.mini { position: absolute; right: 10px; top: 50%; width: 140px; height: 140px; margin-top: -70px; animation: idle 10s ease-in-out infinite; }
.mini .petal { background: rgba(255,255,255,.24); opacity: 1; mix-blend-mode: normal; }
@keyframes idle { 0%, 100% { --s: .14; } 40% { --s: 1; } 50% { --s: 1; } }

/* Flower: six overlapping circles that bloom on the inhale */
.petal { position: absolute; left: 25%; top: 25%; width: 50%; height: 50%; border-radius: 50%; will-change: transform;
  transform: translateX(var(--x, 0px)) rotate(calc(var(--i) * 60deg + var(--s) * 75deg + var(--spin, 0deg))) translateY(calc(var(--s) * -50%)) scale(calc(.3 + var(--s) * .7)); }

/* Today strip */
.today { display: flex; align-items: center; gap: 14px; width: 100%; margin-top: 12px; padding: 12px 16px; background: var(--card); border-radius: 16px; box-shadow: var(--shadow); transition: transform .2s; }
.today-text { flex: 1; min-width: 0; }
.today-main { font-weight: 600; font-size: 16px; font-variant-numeric: tabular-nums; }
.today-sub { color: var(--fg-2); font-size: 14px; }
.chev { color: var(--fg-3); width: 9px; height: 15px; flex: none; }

/* Sections and tiles */
.section { margin-top: 30px; }
.sec-title { font: 700 22px/1.2 var(--font-display); letter-spacing: .01em; margin: 0 4px; }
.sec-note { font-size: 14px; color: var(--fg-2); margin: 2px 4px 12px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.tile { position: relative; display: flex; flex-direction: column; justify-content: flex-end; gap: 2px; min-height: 160px; padding: 14px; border-radius: 20px; color: #fff; background: linear-gradient(150deg, var(--c1), var(--c2)); overflow: hidden; box-shadow: var(--shadow); transition: transform .2s; isolation: isolate; }
.tile .shape { position: absolute; top: 16px; left: 14px; width: calc(100% - 28px); height: 54px; }
.tile-name { font-weight: 600; font-size: 17px; line-height: 1.2; text-wrap: balance; }
.tile-meta { font-size: 13px; opacity: .88; font-variant-numeric: tabular-nums; }

.stack { display: flex; flex-direction: column; gap: 12px; }
.card { background: var(--card); border-radius: 20px; padding: 16px; box-shadow: var(--shadow); }
.card-title { font-weight: 600; font-size: 17px; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
.foot { font-size: 13px; color: var(--fg-2); margin: 14px 4px 0; line-height: 1.45; }

/* Test cards */
.tcard { display: block; width: 100%; background: var(--card); border-radius: 20px; padding: 16px; box-shadow: var(--shadow); transition: transform .2s; }
.tc-head { display: flex; align-items: center; gap: 12px; }
.tc-badge { width: 42px; height: 42px; border-radius: 12px; background: linear-gradient(150deg, var(--c1), var(--c2)); display: grid; place-items: center; flex: none; }
.tc-badge svg { width: 30px; height: 20px; }
.tc-id { flex: 1; min-width: 0; }
.tc-name { font-weight: 600; font-size: 17px; }
.tc-unit { font-size: 13px; color: var(--fg-2); }
.tc-body { display: grid; grid-template-columns: auto auto minmax(0, 1fr); align-items: end; gap: 4px 22px; margin-top: 14px; }
.k { font-size: 12px; color: var(--fg-2); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
.v { font: 700 30px/1.05 var(--font-round); font-variant-numeric: tabular-nums; margin-top: 2px; }
.v.sm { font-size: 22px; color: var(--fg-2); }
.v.none { color: var(--fg-3); }
.spark { width: 100%; height: 40px; }
.pill { display: inline-block; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--tint-soft); color: var(--tint); white-space: nowrap; }

/* Summary */
.ring-card { display: flex; align-items: center; gap: 18px; }
.ring-text { flex: 1; min-width: 0; }
.big-num { font: 700 34px/1 var(--font-round); font-variant-numeric: tabular-nums; }
.big-num .unit { font-size: 17px; font-weight: 600; color: var(--fg-2); }
.ring-sub { color: var(--fg-2); font-size: 15px; margin-top: 6px; }
.streak { display: flex; gap: 18px; margin-top: 12px; flex-wrap: wrap; }
.streak .v { font-size: 22px; }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.stat { background: var(--card); border-radius: 16px; padding: 14px 16px; box-shadow: var(--shadow); }
.stat-label { font-size: 13px; color: var(--fg-2); font-weight: 500; }
.stat-val { font: 700 26px/1.1 var(--font-round); margin-top: 4px; font-variant-numeric: tabular-nums; }
.stat-val .unit { font-size: 15px; color: var(--fg-2); font-weight: 600; }
.chart { width: 100%; height: auto; overflow: visible; }
.chart text { font-family: var(--font); font-variant-numeric: tabular-nums; }
.ax { fill: var(--fg-2); font-size: 11px; }
.ax-strong { fill: var(--tint); font-size: 11px; font-weight: 700; }
.val { fill: var(--fg); font-size: 11px; font-weight: 600; }
.legend { display: flex; gap: 14px; font-size: 13px; color: var(--fg-2); align-items: center; flex-wrap: wrap; }
.legend i { display: inline-block; vertical-align: middle; margin-right: 6px; }
.lg-dash { width: 16px; border-top: 2px dashed var(--fg-3); }
.lg-bar { width: 10px; height: 10px; border-radius: 3px; background: var(--tint); }
.chart-empty { display: grid; place-items: center; text-align: center; min-height: 150px; color: var(--fg-2); font-size: 15px; border-radius: 14px; background: var(--fill); padding: 16px; }
.mix-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; }
.mix-row + .mix-row { margin-top: 12px; }
.mix-name { font-size: 15px; font-weight: 500; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mix-val { font-size: 15px; color: var(--fg-2); font-variant-numeric: tabular-nums; }
.mix-track { grid-column: 1 / -1; height: 8px; border-radius: 4px; background: var(--fill); overflow: hidden; }
.mix-track i { display: block; height: 100%; border-radius: 4px; background: linear-gradient(90deg, var(--c1), var(--c2)); }

/* Grouped list */
.group { background: var(--card); border-radius: 14px; overflow: hidden; box-shadow: var(--shadow); }
.row { position: relative; display: flex; align-items: center; gap: 12px; min-height: 50px; padding: 10px 16px; width: 100%; }
.row + .row::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; height: 1px; transform: scaleY(.5); transform-origin: top; background: var(--sep); }
.row-main { flex: 1; min-width: 0; }
.row-title { font-size: 16px; }
.row-sub { font-size: 13px; color: var(--fg-2); }
.row-val { font: 600 17px/1.2 var(--font-round); font-variant-numeric: tabular-nums; text-align: right; }
.row-val.muted { color: var(--fg-3); }
.dot { width: 30px; height: 30px; border-radius: 9px; flex: none; background: linear-gradient(150deg, var(--c1), var(--c2)); }
.row .mini-spark { width: 64px; height: 26px; flex: none; }
.grp-label { font-size: 13px; color: var(--fg-2); text-transform: uppercase; letter-spacing: .04em; margin: 22px 16px 7px; }
.grp-foot { font-size: 13px; color: var(--fg-2); margin: 7px 16px 0; line-height: 1.4; }
.row input[type="text"] { flex: 1; min-width: 0; font: inherit; font-size: 16px; color: var(--fg); background: transparent; border: 0; text-align: right; padding: 4px 0; }
.row input[type="text"]::placeholder { color: var(--fg-3); }
.danger { color: var(--danger); }

.switch { position: relative; width: 51px; height: 31px; flex: none; }
.switch input { appearance: none; -webkit-appearance: none; margin: 0; width: 51px; height: 31px; border-radius: 16px; background: var(--fill-2); transition: background .25s; cursor: pointer; display: block; }
.switch input:checked { background: var(--switch-on); }
.switch span { position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 3px 8px rgba(0,0,0,.15), 0 1px 1px rgba(0,0,0,.16); transition: transform .25s; pointer-events: none; }
.switch input:checked + span { transform: translateX(20px); }
.stepper { display: flex; align-items: center; gap: 2px; background: var(--fill); border-radius: 9px; padding: 2px; flex: none; }
.stepper button { width: 44px; height: 30px; border-radius: 7px; display: grid; place-items: center; font-size: 20px; line-height: 1; }
.stepper button:active { background: var(--fill-2); }
.stepper-val { min-width: 70px; text-align: center; font-weight: 600; font-size: 15px; font-variant-numeric: tabular-nums; }

/* Segmented control */
.seg { display: flex; background: var(--fill); border-radius: 9px; padding: 2px; gap: 2px; }
.seg button { flex: 1; min-width: 0; height: 32px; border-radius: 7px; font-size: 14px; font-weight: 500; text-align: center; transition: background .2s; white-space: nowrap; }
.seg button[aria-checked="true"] { background: var(--seg-on); box-shadow: var(--seg-shadow); font-weight: 600; }

/* Buttons */
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 52px; border-radius: 14px; font-weight: 600; font-size: 17px; text-align: center; font-variant-numeric: tabular-nums; }
.btn:active { opacity: .82; }
.btn-grad { background: linear-gradient(135deg, var(--c1), var(--c2)); color: #fff; text-shadow: 0 1px 1px rgba(0,0,0,.12); }
.btn-primary { background: var(--tint); color: var(--on-tint); }
.btn-white { background: #fff; color: #000; }
.btn-glass { background: rgba(255,255,255,.14); color: #fff; }
.btn-sm { height: 34px; width: auto; padding: 0 14px; font-size: 15px; border-radius: 999px; }

/* Sheet */
.scrim { position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.36); opacity: 0; transition: opacity .3s; }
.scrim.on { opacity: 1; }
.scrim:not(.on), .sheet.closing { pointer-events: none; }
html, button, a, label, input, textarea { touch-action: manipulation; }
.sh-body > .btn-grad:last-child { position: sticky; bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); z-index: 3; flex: none; box-shadow: 0 -18px 18px 2px var(--card), 0 44px 0 14px var(--card); }
.hero-cta { position: relative; z-index: 2; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 31; max-width: 620px; margin: 0 auto; max-height: calc(100% - env(safe-area-inset-top, 0px) - 28px); overflow-y: auto; overscroll-behavior: contain; background: var(--card); border-radius: 14px 14px 0 0; padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 22px); transform: translateY(105%); transition: transform .42s cubic-bezier(.2,.9,.25,1); }
.sheet.on { transform: none; }
.sheet.plain { background: var(--bg); }
.sh-hero { position: relative; padding: 24px 20px 20px; color: #fff; background: linear-gradient(150deg, var(--c1), var(--c2)); isolation: isolate; overflow: hidden; }
.grabber { position: absolute; top: 6px; left: 50%; width: 36px; height: 5px; margin-left: -18px; border-radius: 3px; background: rgba(255,255,255,.55); }
.plain .grabber { background: var(--fg-3); }
.sh-close { position: absolute; top: 16px; right: 16px; width: 30px; height: 30px; border-radius: 50%; background: rgba(0,0,0,.2); color: #fff; display: grid; place-items: center; }
.sh-close svg { width: 12px; height: 12px; }
.sh-shape { width: 100%; height: 86px; margin: 10px 0 12px; }
.sh-cat { font-size: 13px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; opacity: .86; }
.sh-title { font: 700 28px/1.15 var(--font-display); margin-top: 2px; text-wrap: balance; }
.sh-body { padding: 18px 20px 0; display: flex; flex-direction: column; gap: 16px; }
.sh-blurb { font-size: 17px; line-height: 1.4; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { padding: 6px 12px; border-radius: 999px; background: var(--fill); font-size: 15px; font-variant-numeric: tabular-nums; }
.chip b { font-weight: 600; }
.field { display: flex; flex-direction: column; gap: 8px; }
.field-label { font-size: 13px; font-weight: 600; color: var(--fg-2); text-transform: uppercase; letter-spacing: .04em; }
.note { font-size: 15px; color: var(--fg-2); line-height: 1.45; }
.note strong { color: var(--fg); font-weight: 600; }
.warn { font-size: 14px; line-height: 1.45; padding: 12px 14px; border-radius: 12px; background: var(--warn-soft); }
.steps { margin: 0; padding: 0; list-style: none; counter-reset: s; display: flex; flex-direction: column; gap: 10px; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 26px 1fr; gap: 10px; font-size: 16px; line-height: 1.4; }
.steps li::before { content: counter(s); width: 24px; height: 24px; border-radius: 50%; background: var(--fill); display: grid; place-items: center; font-size: 13px; font-weight: 700; margin-top: 1px; }
.mini-stats { display: flex; gap: 22px; flex-wrap: wrap; }
.plain-head { display: flex; align-items: center; justify-content: space-between; padding: 22px 20px 4px; }
.plain-head h2 { font: 700 22px/1.2 var(--font-display); }
.plain-body { padding: 0 16px; }

/* Tab bar */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--bar); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); padding-bottom: max(6px, env(safe-area-inset-bottom, 0px)); }
.tabbar::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 1px; transform: scaleY(.5); transform-origin: top; background: var(--sep); }
.tabbar-in { max-width: 620px; margin: 0 auto; display: grid; grid-template-columns: repeat(6, 1fr); padding: 6px 4px 0; }
.tab { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10.5px; font-weight: 500; color: var(--fg-2); padding: 2px 0; text-align: center; letter-spacing: 0; }
.tab svg { width: 27px; height: 27px; }
.tab[aria-current="page"] { color: var(--tint); }
.tab[aria-current="page"] .tfill { fill: currentColor; fill-opacity: .2; }

/* Practice stage — always dark, like a dimmed room */
.stage { position: fixed; inset: 0; z-index: 50; background: #000; color: #fff; display: flex; flex-direction: column; padding: calc(env(safe-area-inset-top, 0px) + 10px) 20px calc(env(safe-area-inset-bottom, 0px) + 20px); overflow: hidden; --s: 0; user-select: none; -webkit-user-select: none; animation: stageIn .4s ease both; color-scheme: dark; }
@keyframes stageIn { from { opacity: 0; } to { opacity: 1; } }
.stage-glow { position: absolute; left: 50%; top: 44%; width: min(150vw, 980px); aspect-ratio: 1; transform: translate(-50%, -50%) scale(calc(.72 + var(--s) * .38)); background: radial-gradient(closest-side, var(--g1), var(--g2) 45%, transparent 72%); opacity: calc(.42 + var(--s) * .4); pointer-events: none; }
.stage-top { position: relative; z-index: 2; display: grid; grid-template-columns: 40px minmax(0, 1fr) 40px; align-items: center; gap: 8px; }
.glass { width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,.13); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); display: grid; place-items: center; color: #fff; }
.glass svg { width: 16px; height: 16px; }
.st-name { text-align: center; font-weight: 600; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.st-sub { text-align: center; font-size: 13px; color: rgba(255,255,255,.62); font-variant-numeric: tabular-nums; min-height: 1.3em; }
.stage-prog { position: relative; z-index: 2; height: 3px; border-radius: 2px; background: rgba(255,255,255,.14); margin: 14px 2px 0; overflow: hidden; }
.stage-prog i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--c1), var(--c2)); border-radius: 2px; }
.stage-center { flex: 1; min-height: 0; display: grid; place-items: center; position: relative; z-index: 1; }
.flower-wrap { position: relative; width: min(76vw, 46vh, 360px); aspect-ratio: 1; max-width: 100%; }
.ring { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: .9; }
.ring .track { stroke: rgba(255,255,255,.1); }
.ring .prog { stroke: rgba(255,255,255,.72); stroke-linecap: round; }
.flower { position: absolute; inset: 9%; }
.stage .flower .petal { background: radial-gradient(circle at 50% 30%, var(--c2), var(--c1) 78%); opacity: .6; mix-blend-mode: screen; }
.count { position: absolute; inset: 0; display: grid; place-items: center; font: 600 46px/1 var(--font-round); font-variant-numeric: tabular-nums; text-shadow: 0 1px 14px rgba(0,0,0,.3); pointer-events: none; }
.is-open .count { font-size: 58px; }
.count small { font-size: .5em; opacity: .72; }
.stage-text { position: relative; z-index: 1; text-align: center; min-height: 116px; padding-top: 6px; }
.phase { font: 700 32px/1.15 var(--font-display); letter-spacing: .005em; text-wrap: balance; }
.phase-sub { margin: 6px auto 0; max-width: 34ch; font-size: 16px; line-height: 1.4; color: rgba(255,255,255,.7); min-height: 1.4em; text-wrap: pretty; }
.stage-bottom { position: relative; z-index: 1; display: flex; justify-content: center; align-items: center; min-height: 72px; padding-top: 8px; }
.pause-btn { width: 64px; height: 64px; border-radius: 50%; background: rgba(255,255,255,.14); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); display: grid; place-items: center; }
.pause-btn svg { width: 22px; height: 22px; }
.tap-hint { font-size: 15px; font-weight: 500; color: rgba(255,255,255,.82); padding: 12px 22px; border-radius: 999px; background: rgba(255,255,255,.12); animation: hint 2.4s ease-in-out infinite; }
@keyframes hint { 50% { background: rgba(255,255,255,.2); } }
.panel { position: absolute; inset: 0; z-index: 5; display: flex; flex-direction: column; overflow-y: auto; padding: calc(env(safe-area-inset-top, 0px) + 24px) 24px calc(env(safe-area-inset-bottom, 0px) + 24px); background: rgba(0,0,0,.56); -webkit-backdrop-filter: blur(26px); backdrop-filter: blur(26px); animation: stageIn .3s ease both; }
.panel-in { margin: auto; width: 100%; max-width: 380px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 14px; }
.res-title { font: 700 28px/1.15 var(--font-display); }
.res-p { color: rgba(255,255,255,.7); font-size: 16px; }
.res-kicker { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: rgba(255,255,255,.66); }
.res-big { font: 700 76px/1 var(--font-round); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.res-big small { font-size: .42em; opacity: .7; }
.badge { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; font-size: 14px; font-weight: 600; background: rgba(255,255,255,.14); }
.badge.pr { background: linear-gradient(135deg, var(--c1), var(--c2)); }
.res-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; width: 100%; margin-top: 4px; }
.res-cell { background: rgba(255,255,255,.08); border-radius: 14px; padding: 12px 14px; text-align: left; }
.res-cell .k { color: rgba(255,255,255,.6); }
.res-cell .v { font-size: 24px; }
.res-list { width: 100%; background: rgba(255,255,255,.08); border-radius: 14px; overflow: hidden; text-align: left; }
.res-list .row + .row::before { background: rgba(255,255,255,.14); }
.res-list .row-sub { color: rgba(255,255,255,.6); }
.res-actions { display: flex; gap: 10px; width: 100%; margin-top: 8px; }
.check { width: 76px; height: 76px; }
.check circle { fill: none; stroke: rgba(255,255,255,.18); stroke-width: 3; }
.check .c2 { stroke: url(#ckg); stroke-dasharray: 214; stroke-dashoffset: 214; stroke-linecap: round; animation: draw .9s .1s ease forwards; }
.check path { fill: none; stroke: #fff; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 40; stroke-dashoffset: 40; animation: draw .4s .75s ease forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.meter { width: 100%; margin-top: 4px; }
.meter-band { font: 700 22px/1.2 var(--font-display); margin-bottom: 10px; }
.meter-track { position: relative; display: flex; gap: 3px; height: 10px; }
.meter-track i { border-radius: 3px; background: #fff; }
.meter-mark { position: absolute; top: -6px; width: 4px; height: 22px; margin-left: -2px; border-radius: 2px; background: #fff; box-shadow: 0 0 0 3px rgba(0,0,0,.6); }
.meter-ticks { position: relative; height: 18px; margin-top: 6px; font-size: 12px; color: rgba(255,255,255,.6); font-variant-numeric: tabular-nums; }
.meter-ticks span { position: absolute; transform: translateX(-50%); }
.meter-note { font-size: 14px; color: rgba(255,255,255,.7); margin-top: 10px; line-height: 1.4; }


/* Wide tile for odd-numbered groups */
.tile.wide { grid-column: 1 / -1; min-height: 150px; }
.tile-full { font-weight: 400; opacity: .86; }

/* Neuroscience block + brake/gas lever */
.neuro { display: flex; flex-direction: column; gap: 10px; padding: 14px 16px; border-radius: 14px; background: var(--fill); }
.neuro-text { font-size: 15px; line-height: 1.45; }
.cite { font-size: 12px; color: var(--fg-2); line-height: 1.4; }
.lever-track { position: relative; height: 6px; border-radius: 3px; margin-top: 6px; background: linear-gradient(90deg, var(--brake), var(--bal) 50%, var(--gas)); }
.lever-dot { position: absolute; top: 50%; width: 16px; height: 16px; margin: -8px 0 0 -8px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 3px var(--c1, var(--tint)), 0 2px 6px rgba(0,0,0,.25); }
.lever-labels, .spec-labels { display: flex; justify-content: space-between; font-size: 11px; font-weight: 600; color: var(--fg-2); text-transform: uppercase; letter-spacing: .05em; margin-top: 8px; }

/* Lab */
.lead { margin: -6px 4px 16px; }
.pedals { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-bottom: 14px; }
.pedal { border-radius: 14px; padding: 12px 14px; background: var(--fill); min-width: 0; }
.pedal-title { font-weight: 600; font-size: 16px; margin-top: 2px; }
.pedal p { font-size: 14px; color: var(--fg-2); margin-top: 4px; line-height: 1.4; }
.caption { font-size: 13px; color: var(--fg-2); line-height: 1.45; margin-top: 10px; }
.spec { padding-block: 8px 14px; }
.spec-row { position: relative; display: grid; grid-template-columns: 8.6em minmax(0, 1fr); align-items: center; gap: 14px; width: 100%; padding: 10px 0; }
.spec-row + .spec-row::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 1px; transform: scaleY(.5); transform-origin: top; background: var(--sep); }
.spec-name { font-size: 15px; font-weight: 500; line-height: 1.25; min-width: 0; }
.spec-track { position: relative; height: 4px; border-radius: 2px; background: var(--fill-2); }
.spec-track::after { content: ""; position: absolute; left: 50%; top: -4px; width: 1px; height: 12px; background: var(--fg-3); }
.spec-dot { position: absolute; top: 50%; width: 15px; height: 15px; margin: -7.5px 0 0 -7.5px; border-radius: 50%; background: linear-gradient(150deg, var(--c1), var(--c2)); box-shadow: 0 0 0 2px var(--card); z-index: 1; }
.spec-axis { display: grid; grid-template-columns: 8.6em minmax(0, 1fr); gap: 14px; }
.row.find { display: grid; grid-template-columns: 4.3em minmax(0, 1fr); column-gap: 14px; row-gap: 4px; align-items: start; padding: 14px 16px; }
.find-stat { grid-row: 1 / span 3; font: 700 24px/1.1 var(--font-round); color: var(--tint); font-variant-numeric: tabular-nums; }
.find-text { font-size: 15px; line-height: 1.4; }
.find-cite { font-size: 12px; color: var(--fg-2); }
.find a, .foot a { color: var(--tint); font-size: 13px; font-weight: 600; text-decoration: none; }
.row .k { margin-bottom: 1px; }
.rules { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 12px; }
.rules li { font-size: 15px; line-height: 1.45; }
.rules b { font-weight: 600; }

/* Brake vs gas balance */
.bal-bar { display: flex; height: 14px; border-radius: 7px; overflow: hidden; gap: 2px; background: var(--fill); }
.bal-bar i { display: block; height: 100%; }
.bal-legend { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 12px; }
.bal-legend .k { display: flex; align-items: center; gap: 6px; }
.bal-legend .k i { width: 8px; height: 8px; border-radius: 2px; flex: none; }
.bal-legend .v { font-size: 20px; }
.bal-legend .unit { font-size: 13px; color: var(--fg-2); font-weight: 600; }

/* Stage: guided and gaze modes */
.flower, .ring, .count { transition: opacity .8s; }
.yantra { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; transition: opacity .8s; pointer-events: none; overflow: visible; }
.gaze-mode .flower, .gaze-mode .ring, .gaze-mode .count { opacity: 0; }
.gaze-mode .yantra { opacity: 1; }
.stage.gaze-mode .stage-glow { opacity: .2; }
.stage.eyes-closed .yantra { opacity: 0; transition-duration: .25s; }
.stage.eyes-closed .stage-glow { opacity: .05; }
.yantra [data-l] { opacity: 0; transition: opacity 1.6s ease; }
.yantra [data-l].on { opacity: 1; }
.yantra .ln { fill: none; stroke: rgba(255,255,255,.8); stroke-width: 1.1; }
.yantra .gold { fill: none; stroke: #F2C14E; stroke-width: 1.3; }
.guide-mode .count { opacity: 0; }
.res-neuro { width: 100%; text-align: left; background: rgba(255,255,255,.08); border-radius: 14px; padding: 12px 14px; }
.res-neuro .k { color: rgba(255,255,255,.6); }
.res-neuro p { font-size: 15px; line-height: 1.4; margin-top: 4px; }


/* Profile: player card */
.pcard { position: relative; overflow: hidden; isolation: isolate; border-radius: 26px; padding: 20px; color: #fff; background: linear-gradient(145deg, var(--t1), var(--t2)); box-shadow: 0 10px 30px rgba(0,0,0,.16); }
.pcard::before { content: ""; position: absolute; inset: 0; z-index: -1; background: radial-gradient(120% 80% at 100% 0%, rgba(255,255,255,.32), transparent 52%), repeating-linear-gradient(135deg, rgba(255,255,255,.055) 0 2px, transparent 2px 14px); }
.pcard::after { content: ""; position: absolute; top: 0; bottom: 0; left: -60%; width: 50%; z-index: -1; background: linear-gradient(105deg, transparent, rgba(255,255,255,.3), transparent); transform: skewX(-12deg) translateX(0); animation: sheen 2.2s .25s ease both; }
@keyframes sheen { from { transform: skewX(-12deg) translateX(0); } to { transform: skewX(-12deg) translateX(420%); } }
.pc-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.pc-ovr-n { font: 800 64px/.9 var(--font-round); letter-spacing: -.03em; text-shadow: 0 2px 12px rgba(0,0,0,.2); font-variant-numeric: tabular-nums; }
.pc-pos { font: 700 13px/1 var(--font-round); letter-spacing: .14em; margin-top: 8px; opacity: .92; }
.pc-avatar { width: 76px; height: 76px; flex: none; border-radius: 50%; overflow: hidden; border: 3px solid rgba(255,255,255,.62); background: rgba(0,0,0,.16); display: grid; place-items: center; font: 700 30px var(--font-round); }
.pc-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
.pc-name { font: 800 30px/1.05 var(--font-display); letter-spacing: .03em; text-transform: uppercase; margin-top: 16px; overflow-wrap: anywhere; text-shadow: 0 1px 8px rgba(0,0,0,.15); }
.pc-arch { font-size: 15px; font-weight: 500; opacity: .92; margin-top: 3px; }
.pc-rank { display: inline-flex; align-items: center; gap: 6px; margin-top: 12px; padding: 5px 12px 5px 7px; border-radius: 999px; background: rgba(0,0,0,.24); font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
.pc-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px 12px; margin-top: 16px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.32); }
.pc-stat { display: flex; align-items: baseline; gap: 6px; }
.pc-stat b { font: 800 26px/1 var(--font-round); font-variant-numeric: tabular-nums; }
.pc-stat span { font-size: 12px; font-weight: 700; letter-spacing: .08em; opacity: .86; }
.pc-stat.na b { opacity: .5; }
.pc-desc { font-size: 14px; line-height: 1.4; opacity: .92; margin-top: 14px; }

/* Level + rank */
.lvl-row { display: flex; align-items: center; gap: 14px; }
.lvl-badge { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; font: 800 24px var(--font-round); color: var(--on-tint); background: linear-gradient(145deg, var(--tint-2), var(--tint)); flex: none; }
.lvl-main { flex: 1; min-width: 0; }
.lvl-title { font-weight: 600; font-size: 17px; }
.lvl-xp { font: 700 16px var(--font-round); color: var(--fg-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.xpbar { height: 10px; border-radius: 5px; background: var(--fill); overflow: hidden; margin-top: 14px; }
.xpbar i { display: block; height: 100%; border-radius: 5px; background: linear-gradient(90deg, var(--tint-2), var(--tint)); transition: width 1.3s cubic-bezier(.2,.8,.2,1); }
.lvl-foot { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; color: var(--fg-2); margin-top: 6px; font-variant-numeric: tabular-nums; }
.xp-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.xp-chips span { font-size: 12px; font-weight: 600; padding: 4px 9px; border-radius: 999px; background: var(--fill); color: var(--fg-2); }
.ladder { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 4px; margin-top: 16px; }
.ladder i { height: 8px; border-radius: 4px; background: var(--fill-2); }
.ladder i.cur { box-shadow: 0 0 0 2px var(--card), 0 0 0 3.5px var(--fg); }
.ladder-labels { display: flex; justify-content: space-between; font-size: 11px; font-weight: 600; color: var(--fg-2); margin-top: 8px; text-transform: uppercase; letter-spacing: .05em; }

/* Quests */
.row.quest { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; column-gap: 12px; row-gap: 8px; align-items: center; padding: 12px 16px; }
.q-ico { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--fill-2); display: grid; place-items: center; color: #fff; }
.quest.done .q-ico { background: var(--switch-on); border-color: var(--switch-on); }
.q-title { font-weight: 600; font-size: 16px; }
.q-desc { font-size: 13px; color: var(--fg-2); font-variant-numeric: tabular-nums; }
.q-xp { font: 700 13px var(--font-round); color: var(--tint); background: var(--tint-soft); padding: 4px 9px; border-radius: 999px; white-space: nowrap; }
.quest.done .q-xp { color: var(--fg-2); background: var(--fill); }
.q-bar { grid-column: 2 / -1; height: 5px; border-radius: 3px; background: var(--fill); overflow: hidden; }
.q-bar i { display: block; height: 100%; background: var(--tint); border-radius: 3px; }
.quest.done .q-bar i { background: var(--switch-on); }

/* Skill web */
.attr { position: relative; display: grid; grid-template-columns: 2.6em minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 10px 0; }
.attr + .attr::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 1px; transform: scaleY(.5); transform-origin: top; background: var(--sep); }
.attr-k { font: 800 13px var(--font-round); letter-spacing: .06em; color: var(--tint); }
.attr-v { font: 700 20px var(--font-round); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.delta { font-size: 12px; font-weight: 700; margin-left: 6px; }
.delta.up { color: var(--switch-on); }
.delta.down { color: var(--fg-2); }
.coach-head { font: 700 20px/1.25 var(--font-display); margin: 4px 0 12px; text-wrap: balance; }
.coach .row.coach-next { margin-top: 14px; padding: 12px 14px; border-radius: 14px; background: var(--fill); }
.coach .btn[disabled] { opacity: .6; }

/* Trophy case */
.trophies { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px 6px; }
.trophy { display: flex; flex-direction: column; align-items: center; gap: 7px; text-align: center; min-width: 0; }
.tro-badge { width: 58px; height: 58px; border-radius: 18px; display: grid; place-items: center; flex: none; color: #fff; background: radial-gradient(circle at 30% 22%, rgba(255,255,255,.38), transparent 58%), linear-gradient(150deg, var(--r1), var(--r2)); box-shadow: 0 0 0 2px var(--card), 0 0 0 4px var(--r1); }
.tro-badge svg { width: 28px; height: 28px; }
.trophy.locked .tro-badge { background: var(--fill); color: var(--fg-3); box-shadow: 0 0 0 2px var(--card), 0 0 0 4px var(--fill-2); }
.tro-name { font-size: 11.5px; font-weight: 600; line-height: 1.2; letter-spacing: -.01em; }
.trophy.locked .tro-name { color: var(--fg-2); }
.tro-r { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; }
.tro-prog { width: 44px; height: 4px; border-radius: 2px; background: var(--fill); overflow: hidden; }
.tro-prog i { display: block; height: 100%; background: var(--fg-3); }
.badge-body { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 14px; padding-top: 10px; }
.badge-body .tro-badge { width: 104px; height: 104px; border-radius: 30px; }
.badge-body .tro-badge svg { width: 50px; height: 50px; }
.badge-body .xpbar { width: 70%; }

/* Activity + hours + season */
.heat-legend { display: flex; align-items: center; justify-content: flex-end; gap: 4px; font-size: 12px; color: var(--fg-2); margin-top: 10px; }
.heat-legend i { width: 11px; height: 11px; border-radius: 3px; background: var(--tint); }
.hours { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; align-items: center; }
.kv { display: flex; flex-direction: column; gap: 10px; }
.kv .v { font-size: 19px; }
.split { display: flex; height: 8px; border-radius: 4px; overflow: hidden; gap: 2px; margin-top: 14px; background: var(--fill); }
.split i { display: block; height: 100%; }
.split-legend { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin-top: 8px; font-size: 12px; color: var(--fg-2); }
.split-legend b { display: block; font: 700 15px var(--font-round); color: var(--fg); }
.season-row { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 12px; align-items: center; padding: 11px 16px; }
.season-row + .season-row::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; height: 1px; transform: scaleY(.5); transform-origin: top; background: var(--sep); }
.season-v { font: 700 17px var(--font-round); font-variant-numeric: tabular-nums; text-align: right; }
.chipd { font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: var(--fill); color: var(--fg-2); min-width: 54px; text-align: center; font-variant-numeric: tabular-nums; }
.chipd.up { background: rgba(52,199,89,.16); color: var(--switch-on); }
.bk-actions { display: flex; gap: 10px; margin-top: 14px; }
.bk-actions .btn { flex: 1; width: auto; }
.bk-actions .btn:not(.btn-primary) { background: var(--fill); color: var(--fg); }
.bk-count { font: 600 15px/1.4 var(--font); color: var(--fg); margin: 2px 4px 4px; }
.vh { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; pointer-events: none; }
#restore-text { min-height: 150px; font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; margin-top: 12px; }
#bondPops { position: fixed; left: 0; right: 0; top: calc(env(safe-area-inset-top, 0px) + 10px); z-index: 90; display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; }
.bond-pop { display: inline-flex; align-items: center; gap: 8px; max-width: calc(100% - 32px); padding: 5px 16px 5px 5px; border-radius: 999px; background: var(--card); color: var(--fg); box-shadow: 0 10px 28px rgba(0,0,0,.24), 0 0 0 1px var(--sep); font-size: 15px; font-weight: 500; animation: bondIn .5s cubic-bezier(.2,.9,.3,1.25) both; }
.bond-pop > b { font: 700 18px/1 var(--font-round); font-variant-numeric: tabular-nums; background: linear-gradient(90deg, #8C6CF0, #2A9DF4); -webkit-background-clip: text; background-clip: text; color: transparent; }
.bond-pop span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bond-pop .orb { flex: none; }

.orb.wren-av { padding: 3px; }

(() => {
'use strict';
/* ---------- crash reporter: shows any error on screen so it can be screenshotted ---------- */
const BUILD = 'Alpha 1.0';
const Crash = { last: '', shown: 0, trail: [], log: [], timer: null };
try { Crash.log = JSON.parse(localStorage.getItem('second-wind:v1:errors') || '[]') || []; } catch (e) {}
function crashContext() {
  const c = {};
  try { c.tab = ui.tab + '/' + (ui.bview || ''); } catch (e) {}
  try { c.sheet = ui.sheet ? ui.sheet.kind + ':' + (ui.sheet.id || '') + ':' + ui.sheet.opt : null; } catch (e) {}
  try { c.session = P ? `${P.id} on=${P.on} paused=${P.paused} step=${P.i}` : null; } catch (e) {}
  try { c.audio = A.ctx ? A.ctx.state : 'none'; c.voice = Voice.state; } catch (e) {}
  return c;
}
function crashSave() {
  try { localStorage.setItem('second-wind:v1:errors', JSON.stringify(Crash.log.slice(-20))); } catch (e) {}
  clearTimeout(Crash.timer);
  Crash.timer = setTimeout(() => { try { if (Cloud.diag) Cloud.diag.set({ errors: Crash.log.slice(-20) }).catch(() => {}); } catch (e) {} }, 800);
}
function crashBanner(msg, where) {
  const text = String(msg || 'Unknown error').slice(0, 600);
  if (/ResizeObserver loop|Script error\.?$/i.test(text)) return;
  Crash.log.push({ t: Date.now(), msg: text, where: where || '', build: BUILD, ua: navigator.userAgent.slice(0, 160), trail: Crash.trail.slice(-8), ctx: crashContext() });
  crashSave();

  Crash.shown++;
  let b = document.getElementById('crash');
  if (!b) {
    b = document.createElement('div'); b.id = 'crash'; b.setAttribute('role', 'alert');
    b.style.cssText = 'position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:9999;background:#B3261E;color:#fff;font:600 13px/1.4 -apple-system,system-ui,sans-serif;padding:12px 14px;border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.35);white-space:pre-wrap;word-break:break-word';
    b.addEventListener('click', () => b.remove());
    document.body.appendChild(b);
  }

document.addEventListener('click', e => { const b = e.target && e.target.closest && e.target.closest('[data-act],[data-sact]'); if (b) { Crash.last = (b.dataset.act || b.dataset.sact) + (b.dataset.id ? ':' + b.dataset.id : ''); Crash.trail.push(new Date().toTimeString().slice(0, 8) + ' ' + Crash.last); if (Crash.trail.length > 12) Crash.trail.shift(); } }, true);

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const ease = x => 0.5 - 0.5 * Math.cos(Math.PI * clamp(x, 0, 1));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const pad2 = n => String(n).padStart(2, '0');
const dayKey = t => { const d = new Date(t); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); };
const fmtClock = s => { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ':' + pad2(s % 60); };
const fmtHold = s => { const t = Math.floor(s); return Math.floor(t / 60) + ':' + pad2(t % 60); };
const holdHTML = s => { const t = Math.floor(s * 10); const sec = Math.floor(t / 10); return Math.floor(sec / 60) + ':' + pad2(sec % 60) + '<small>.' + (t % 10) + '</small>'; };
const fmtMins = sec => { const m = sec / 60; if (m <= 0) return '0'; if (m < 1) return '&lt;1'; if (m < 10) return String(Math.round(m * 10) / 10); return String(Math.round(m)); };

/* ---------- breath phases ---------- */
function ph(cue, dur, o = {}) {
  const base = {
    in: { from: 0, to: 1, label: 'Breathe in', chip: 'In' },
    out: { from: 1, to: 0, label: 'Breathe out', chip: 'Out' },
    hold: { from: 1, to: 1, label: 'Hold', chip: 'Hold' },
    empty: { from: 0, to: 0, label: 'Hold', sub: 'Lungs empty', chip: 'Hold empty' },
    rest: { from: .4, to: .4, label: 'Breathe naturally', chip: 'Rest' }
  }[cue];
  return Object.assign({ cue, dur }, base, o);
}

function buildPower(o) {
  const st = [], R = o.rounds;
  for (let r = 1; r <= R; r++) {
    const sub = `Round ${r} of ${R}`;
    for (let b = 1; b <= 30; b++) {
      st.push(ph('in', 1.7, { from: .12, label: 'Breathe in deep', sub, fast: true, count: b, of: 30, half: 0, tap: true }));
      st.push(ph('out', 1.3, { to: .12, label: 'Let it go', sub, fast: true, count: b, of: 30, half: 1 }));
    }
    st.push(ph('out', 2, { from: .12, to: 0, label: 'Exhale and relax', sub, nocount: true }));
    st.push({ cue: 'open', dur: null, mode: 'empty', level: 0, label: 'Hold on empty', sub: 'Tap anywhere when you need to breathe', record: 'retention', round: r, say: 'Hold' });
    st.push(ph('in', 3, { label: 'Recovery breath', sub: 'All the way in' }));
    st.push(ph('hold', 15, { sub: 'Squeeze gently' }));

  }
  return st;
}
function buildBellows(o) {
  const st = [], n = o.sets.length;
  o.sets.forEach((pumps, i) => {
    const tag = `Set ${i + 1} of ${n} · ${pumps} pumps`;

const bondLevelAt = L => { let t = 0; for (let i = 1; i < L; i++) t += 80 + 40 * i; return t; };

  const base = bondLevelAt(L), next = L < BOND_MAX ? bondLevelAt(L + 1) : base;

  for (const [lv, name] of BOND_TIERS) if (L >= lv) tier = name;

}

function bondEvents() {

    if (!days.has(k)) { days.set(k, 0); ev.push({ key: 'd:' + k, t: s.t + s.sec * 1000, xp: BOND_XP.day, label: 'Showed up today' }); }
    const before = days.get(k), after = before + s.sec;
    days.set(k, after);

  }
  let run = 0, prev = null;
  for (const k of [...days.keys()].sort()) {

    const m = BOND_STREAKS.find(x => x[0] === run);

const Bond = { keys: null, level: 1, queue: [], showing: false };
function bondInit() {
  try { const s = bondState(); Bond.keys = new Set(s.ev.map(e => e.key)); Bond.level = s.lv.level; } catch (e) { Bond.keys = new Set(); }
}
function bondCheck() {
  if (!Bond.keys) return bondInit();
  const s = bondState(), fresh = s.ev.filter(e => !Bond.keys.has(e.key));

  const up = s.lv.level > Bond.level;
  Bond.level = s.lv.level;
  if (!fresh.length) return;
  fresh.sort((a, b) => b.xp - a.xp);
  const shown = fresh.slice(0, 3), rest = fresh.slice(3).reduce((a, e) => a + e.xp, 0);
  shown.forEach(e => Bond.queue.push({ xp: e.xp, label: e.label }));
  if (rest) Bond.queue.push({ xp: rest, label: 'More with Wren' });
  if (up) {
    const u = BOND_UNLOCKS.find(x => x.lv === s.lv.level);

  return h;
}
function testResult(r, prevBest, prevLast, xpH) {
  const T = TEST_BY[P.id], prev = prevBest[r.kind], last = prevLast[r.kind];
  const isPR = !prev || r.sec > prev.sec;
  const badge = isPR ? `<span class="badge pr">${prev ? `New personal best · +${(r.sec - prev.sec).toFixed(1)} s` : 'First result saved'}</span>` : `<span class="badge">Best ${fmtHold(prev.sec)} · ${(prev.sec - r.sec).toFixed(1)} s to go</span>`;
  let meter = '';
  if (T.bands) {
    const band = bandOf(T, r.sec), pct = clamp(r.sec / T.max, 0, 1) * 100;
    const segs = T.bands.map((b, i) => { const end = i < T.bands.length - 1 ? T.bands[i + 1][0] : T.max; return `<i style="flex:${end - b[0]};opacity:${(.2 + i * .17).toFixed(2)}"></i>`; }).join('');
    const ticks = T.bands.slice(1).map(b => `<span style="left:${(b[0] / T.max * 100).toFixed(1)}%">${b[0]} s</span>`).join('');
    meter = `<div class="meter"><div class="meter-band">${band}</div><div class="meter-track">${segs}<span class="meter-mark" style="left:${pct.toFixed(1)}%"></span></div><div class="meter-ticks">${ticks}</div><p class="meter-note">${T.bandNote[band]}</p>${T.recovery ? `<p class="meter-note">${T.recovery(r.sec)}</p>` : ''}</div>`;
  }
  const delta = last ? `${r.sec >= last.sec ? '+' : '−'}${Math.abs(r.sec - last.sec).toFixed(1)} s compared with last time` : '';
  return `<div class="panel-in"><div class="res-kicker">${T.name}</div><div class="res-big">${holdHTML(r.sec)}</div>${badge}${meter}${delta ? `<p class="res-p" style="font-size:15px">${delta}</p>` : ''}
    ${xpH || ''}<div class="res-actions"><button class="btn btn-glass" data-sact="retry">Try again</button><button class="btn btn-white" data-sact="done" data-focus>Done</button></div></div>`;
}

function askEnd() {
  if (!P || !P.on) { closeStage(); return; }
  const st = P.steps[P.i];
  if (st && st.cue === 'open') { P.paused = false; }
  else togglePause(true);
  const saving = P.type !== 'test' && P.active >= 10;
  el.panel.innerHTML = `<div class="panel-in"><h2 class="res-title">End this ${P.type === 'test' ? 'test' : 'session'}?</h2><p class="res-p">${saving ? 'The time you’ve put in so far will be saved.' : P.type === 'test' ? 'This attempt won’t be recorded.' : 'Nothing has been saved yet.'}</p>
    <div class="res-actions"><button class="btn btn-glass" data-sact="end">End</button><button class="btn btn-white" data-sact="resume" data-focus>Keep going</button></div></div>`;
  el.panel.hidden = false;
  const b = el.panel.querySelector('[data-focus]'); if (b) b.focus({ preventScroll: true });
}
function endEarly() {
  el.panel.hidden = true;
  if (!P || !P.on) { closeStage(); return; }
  if (P.type === 'test') { P.on = false; keepAwake(false); A.stop(); hush(); closeStage(); return; }
  finish(false);
}
function closeStage() {
  if (P && P.on) { P.on = false; keepAwake(false); A.stop(); }
  H.stop();
  hush();
  stage.hidden = true; el.panel.hidden = true;
  document.documentElement.classList.remove('staged');
}

stage.addEventListener('click', e => {
  const b = e.target.closest('[data-sact]');
  if (b) {
    const a = b.dataset.sact;
    if (a === 'close') askEnd();
    else if (a === 'pause') togglePause();
    else if (a === 'sound') { A.setMuted(!A.muted); if (A.muted) hush(); soundIcon(); }
    else if (a === 'resume') { el.panel.hidden = true; togglePause(false); }
    else if (a === 'end') endEarly();
    else if (a === 'done') closeStage();
    else if (a === 'reflect') { closeStage(); ui.tab = 'reflect'; ui.refl = 'today'; renderView(); window.scrollTo(0, 0); }
    else if (a === 'retry') { const id = P.id; closeStage(); startTest(id); }
    return;
  }
  if (P && P.on && !P.paused && el.panel.hidden && P.steps[P.i] && P.steps[P.i].cue === 'open') endOpen();
});
document.addEventListener('keydown', e => {
  if (!stage.hidden && P) {
    if (e.key === 'Escape') { e.preventDefault(); if (el.panel.hidden) askEnd(); }
    else if ((e.key === ' ' || e.key === 'Enter') && el.panel.hidden && P.on) {
      e.preventDefault();
      if (P.steps[P.i] && P.steps[P.i].cue === 'open') endOpen(); else togglePause();
    }
  } else if (e.key === 'Escape' && Chat.open) closeChat();
  else if (e.key === 'Escape' && sheetEl) closeSheet();
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden && P && P.on && P.steps[P.i] && P.steps[P.i].cue !== 'open') togglePause(true);
  if (!document.hidden && P && P.on) keepAwake(true);
});
window.addEventListener('resize', () => { if (P) P.wrapW = el.wrap.clientWidth || P.wrapW; });

/* ---------- starting things ---------- */
function startTech(id, optIdx, sh) {
  const T = TECH_BY[id], opt = T.opts[optIdx];
  D.opts[id] = optIdx;
  if (id === 'box' && sh && sh.sideTouched) D.opts.boxSide = sh.side;
  persist(true);
  const readySub = id === 'nsdr' ? 'Lie down and get comfortable' : id === 'trataka' ? 'Sit upright, phone at eye level' : T.cat === 'energy' ? 'Sit upright, somewhere safe' : 'Sit tall, shoulders soft';
  begin({ type: 'tech', id, name: T.name.replace(/\u00AD/g, ''), c: T.c, steps: buildTech(T, opt, sh), optLabel: id === 'box' && sh ? `${opt.label} · ${sh.side} s sides` : opt.label,
    voice: id === 'nsdr' ? !!(sh && sh.voice) : undefined, slow: id === 'nsdr', readySub });
}
function startTest(id) {
  const T = TEST_BY[id], b = bestOf(id);
  begin({ type: 'test', id, name: T.name + ' test', c: T.c, steps: T.build(), topSub: b ? `Your best: ${fmtHold(b.sec)}` : 'First attempt', readySub: 'Sit down and relax your shoulders' });
}
function startTable(rounds, hold) {
  D.opts.tableRounds = rounds; persist(true);
  begin({ type: 'table', id: 'table', name: TABLE.name, c: TABLE.c, steps: buildTable(rounds, hold), optLabel: `${rounds} rounds · ${fmtHold(hold)} holds`, readySub: 'Sit down, somewhere safe' });
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b || stage.contains(b)) return;
  const a = b.dataset.act, s = ui.sheet;
  switch (a) {
    case 'tab':
      goTab(b.dataset.tab); if (ui.tab === 'wren') wrenGreet();
      try { localStorage.setItem(KEY + ':tab', ui.tab); } catch (x) {}
      if (sheetEl) closeSheet();
      renderView(); window.scrollTo(0, 0); break;
    case 'pview': ui.pview = b.dataset.v; renderView(); break;
    case 'bview': ui.tab = 'breathe'; ui.bview = b.dataset.v; renderView(); window.scrollTo(0, 0); break;
    case 'browse-f': ui.bf = b.dataset.k; renderView(); break;
    case 'browse-clear': ui.bq = ''; ui.bf = 'all'; renderView(); break;
    case 'lib-view': ui.tab = 'library'; ui.lib = b.dataset.v; renderView(); window.scrollTo(0, 0); break;
    case 'lib-kind': ui.libKind = b.dataset.k; renderView(); break;
    case 'fav': { const on = toggleFav(b.dataset.id); renderSheet(); toast(on ? 'Added to favorites' : 'Removed from favorites'); if (ui.tab === 'library') renderView(); break; }
    case 'save': {
      const key = b.dataset.key, on = toggleSave(key);
      if (on === null) break;
      document.querySelectorAll('[data-act="save"]').forEach(x => { if (x.dataset.key !== key) return; x.classList.toggle('on', on); x.setAttribute('aria-pressed', on); if (x.dataset.link) x.textContent = on ? 'Saved to Library' : 'Save to Library'; else x.setAttribute('aria-label', on ? 'Remove from Library' : 'Save to Library'); });
      toast(on ? 'Saved to Library' : 'Removed from Library');
      if (ui.tab === 'library') renderView();
      break;
    }
    case 'save-msg': { const m = Chat.msgs[+b.dataset.i]; if (!m) break; const on = toggleSave(msgKey(m), { kind: 'Wren', text: m.text, src: `Wren, ${curWren().mode} mode · ${shortDate(Date.now())}` }); renderChat(true); toast(on ? 'Saved to Library' : 'Removed from Library'); if (ui.tab === 'library') renderView(); break; }
    case 'wren-mode': {
      const w = WREN_BY[b.dataset.id]; if (!w || w.id === D.wren) break;
      D.wren = w.id; persist(true); paintWren();
      Chat.msgs.push({ role: 'note', text: `Wren switched to ${w.mode} mode` }); chatSave();
      renderChat(true); renderView(); if (D.wrenVoice && wrenWake(4000)) wrenSpeak(['ok']);
      break;
    }
    case 'wren-open': openChat(); break;
    case 'sign': D.sign = b.dataset.s; ui.signPick = false; persist(true); renderView(); break;
    case 'sign-pick': ui.signPick = true; renderView(); break;
    case 'horo': readHoroscope(); break;
    case 'save-horo': { const hz = horoToday(); if (!hz) break; const on = toggleSave('horo:' + hz.day + ':' + hz.sign, { kind: 'Horoscope', text: `${hz.theme}. ${hz.text}`, src: `${hz.sign} · ${shortDate(hz.t)} · Wren` }); toast(on ? 'Saved to Library' : 'Removed from Library'); renderView(); break; }
    case 'qa-next': ui.qOff++; ui.qDraft = null; ui.qEdit = false; renderView(); break;
    case 'qa-edit': { ui.qEdit = true; ui.qDraft = null; renderView(); const ta = $('#qa-text'); if (ta) ta.focus(); break; }
    case 'qa-save': {
      const ta = $('#qa-text'), a = (ta ? ta.value : ui.qDraft || '').trim().slice(0, 600), Q = wrenQuestion();
      if (!a) { toast('Write a line first.'); if (ta) ta.focus(); break; }
      const had = D.qa.some(x => x.id === Q.id);
      D.qa = D.qa.filter(x => x.id !== Q.id).concat([{ id: Q.id, t: Date.now(), q: Q.q, a }]).slice(-300);
      ui.qDraft = null; ui.qEdit = false; persist(); renderView(); toast(had ? 'Answer updated.' : 'Saved · +15 XP');
      break;
    }
    case 'qa-talk': { const Q = wrenQuestion(), ans = D.qa.find(x => x.id === Q.id); if (!ans) break; openChat(); wrenSend(`You asked me: "${Q.q}" My answer: ${ans.a}`); break; }
    case 'wren-close': closeChat(); break;
    case 'wren-voice': D.wrenVoice = !D.wrenVoice; persist(true); if (!D.wrenVoice) Voice.stop(); renderChat(); break;
    case 'wren-quick': wrenSend(b.textContent); break;
    case 'wren-clear': Voice.stop(); Chat.msgs = [wrenWelcome()]; chatSave(); renderChat(); break;
    case 'wren-do': wrenDo(+b.dataset.i, +b.dataset.j); break;
    case 'lab-view': ui.tab = 'lab'; ui.lab = b.dataset.v; renderView(); window.scrollTo(0, 0); break;
    case 'refl-view': ui.refl = b.dataset.v; renderView(); window.scrollTo(0, 0); break;
    case 'goto-lab-sound': ui.tab = 'lab'; ui.lab = 'sound'; renderView(); window.scrollTo(0, 0); break;
    case 'tone': openSheet(toneState(+b.dataset.hz)); break;
    case 'begin-tone': if (s) startTone(s.hz, s.opt, s.guide); break;
    case 'lineage': openSheet({ kind: 'lineage', id: b.dataset.id }); break;
    case 'drone':
      D.drone = +b.dataset.hz || 0; persist(true); renderSheet();
      if (A.init()) { A.resume(); A.setMuted(A.muted); A.bell(D.drone || 220, .09); setTimeout(() => { if (!P || !P.on) A.suspend(); }, 3200); }
      if (ui.tab === 'breathe') renderView();
      break;
    case 'save-journal': {
      const ta = $('#journal-text'), text = (ta ? ta.value : ui.jdraft || '').trim().slice(0, 600);
      if (!text) { toast('Write a line first.'); if (ta) ta.focus(); break; }
      const id = dayKey(Date.now()), had = D.journal.some(j => j.id === id && j.text);
      D.journal = D.journal.filter(j => j.id !== id).concat([{ id, t: Date.now(), text, c: contemplationIdx(id) }]).sort((p, q) => p.id < q.id ? -1 : 1).slice(-400);
      ui.jdraft = null; ui.jedit = false; persist(); renderView();
      toast(had ? 'Reflection updated.' : 'Saved · +15 XP');
      break;
    }
    case 'edit-journal': { ui.jedit = true; ui.jdraft = null; renderView(); const ta = $('#journal-text'); if (ta) ta.focus(); break; }
    case 'open': {
      const st = techState(TECH_BY[b.dataset.id], b.dataset.opt != null ? +b.dataset.opt : undefined);
      if (e.target.closest('[data-start]')) { startTech(st.id, st.opt, st); break; }
      openSheet(st); break;
    }
    case 'side-step': if (s) { s.side = clamp(s.side + +b.dataset.d, 3, 8); s.sideTouched = true; renderSheet(); } break;
    case 'test': openSheet({ kind: 'test', id: b.dataset.id }); break;
    case 'table': openSheet({ kind: 'table', rounds: D.opts.tableRounds === 6 ? 6 : 8, hold: tableHoldDefault() }); break;
    case 'settings': openSheet({ kind: 'settings' }); break;
    case 'close-sheet': closeSheet(); break;
    case 'opt': if (s) { s.opt = +b.dataset.i; renderSheet(); } break;
    case 'rounds': if (s) { s.rounds = +b.dataset.n; renderSheet(); } break;
    case 'hold-step': if (s) { s.hold = clamp(s.hold + +b.dataset.d, 10, 240); renderSheet(); } break;
    case 'begin': if (s) startTech(s.id, s.opt, s); break;
    case 'begin-test': if (s) startTest(s.id); break;
    case 'begin-table': if (s) startTable(s.rounds, s.hold); break;
    case 'hist': ui.hist = b.dataset.k; renderView(); break;
    case 'badge': openSheet({ kind: 'badge', id: b.dataset.id }); break;
    case 'coach': askCoach(); break;
    case 'copy-flex': {
      const pf = profile(), text = flexText(pf, archetype(pf));
      const fallback = () => openSheet({ kind: 'flex', text });
      try { navigator.clipboard.writeText(text).then(() => toast('Copied. Go flex.'), fallback); } catch (x) { fallback(); }
      break;
    }
    case 'goal': D.goal = clamp(D.goal + +b.dataset.d, 1, 60); persist(true); renderView(); renderSheet(); break;
    case 'sound': D.sound = b.dataset.k; persist(true); renderSheet(); break;
    case 'reset': if (s) { s.confirmReset = true; renderSheet(); } break;
    case 'bond-how': ui.bondHow = !ui.bondHow; renderView(); break;
    case 'bond-cel-close': bondCelClose(); break;
    case 'look-open': openSheet({ kind: 'look' }); break;
    case 'look-preset': { const p = PRESET_BY[b.dataset.id]; if (p) { lookApply(Object.assign({ preset: p.id }, p.look)); try { w3React(document.querySelector('.look-preview .wren-svg'), 'happy'); } catch (x) {} } break; }
    case 'look-set': {
      const A = curLook(); A[b.dataset.k] = b.dataset.v;
      const m = LOOK_PRESETS.find(p => ['skin', 'hair', 'style', 'eyes', 'streak'].every(k => p.look[k] === A[k]));
      A.preset = m ? m.id : null;
      lookApply(A); break;
    }
    case 'note-del': if (dropNote(b.dataset.id)) { persist(); renderView(); toast('Wren forgot that'); } break;
    case 'note-undo': if (dropNote(b.dataset.id)) { persist(); renderChat(true); if (ui.tab === 'wren') renderView(); toast('Wren forgot that'); } break;
    case 'nick-drop': D.nick = ''; persist(true); renderView(); toast('Nickname dropped'); break;
    case 'backup': openSheet({ kind: 'backup' }); break;
    case 'restore': openSheet({ kind: 'backup', mode: 'restore' }); break;
    case 'backup-copy': {
      const manual = () => { if (ui.sheet) { ui.sheet.manual = true; renderSheet(); } };
      try { navigator.clipboard.writeText(backupText()).then(() => toast('Backup copied'), manual); } catch (x) { manual(); }
      break;
    }
    case 'backup-file': backupFile(); break;
    case 'restore-do': if (s) restoreBackup(s); break;
    case 'reset-cancel': if (s) { s.confirmReset = false; renderSheet(); } break;
    case 'reset-do': {
      const keep = {}; for (const k of SETTINGS) keep[k] = D[k];
      D = Object.assign(DEF(), keep, { resetAt: Date.now(), settingsAt: Date.now() });
      try { bondInit(); } catch (e) {}
      persist(); if (s) s.confirmReset = false; renderView(); renderSheet(); break;
    }
  }
});
document.addEventListener('submit', e => {
  if (!e.target || e.target.dataset.form !== 'note-add') return;
  e.preventDefault();
  const inp = $('#note-input'), n = addNote(inp && inp.value, 'life', 'you');
  if (!n) { toast('Write something first.'); return; }
  persist(); renderView(); toast('Saved. Wren will remember.');
});
document.addEventListener('change', e => {
  if (e.target.id === 'restore-file' && ui.sheet) {
    const f = e.target.files && e.target.files[0];
    if (f) { if (f.size > 8e6) { ui.sheet.err = 'That file is too big to be a backup.'; renderSheet(); return; } f.text().then(t => { if (!ui.sheet) return; ui.sheet.text = t; ui.sheet.err = readBackup(t) ? '' : 'That file isn’t a Second Wind backup.'; renderSheet(); }); }
    return;
  }
  if (e.target.dataset && e.target.dataset.sheet === 'guide' && ui.sheet) { ui.sheet.guide = !!e.target.checked; D.opts.toneGuide = ui.sheet.guide; persist(true); return; }
  if (e.target.dataset && e.target.dataset.sheet === 'asdrone' && ui.sheet) { D.drone = e.target.checked ? ui.sheet.hz : 0; persist(true); if (ui.tab === 'breathe') renderView(); return; }
  if (e.target.dataset && e.target.dataset.sheet === 'voice' && ui.sheet) { ui.sheet.voice = !!e.target.checked; D.opts.nsdrVoice = ui.sheet.voice; persist(true); return; }
  const k = e.target.dataset && e.target.dataset.set;
  if (!k || k === 'name') return;
  D[k] = !!e.target.checked; persist(true);
  if (D[k] && k === 'haptics') H.tap('double');
});
let nameTimer = null;
document.addEventListener('input', e => {
  if (e.target.id === 'chat-input') { try { chatTyping(); } catch (x) {} return; }
  if (e.target.id === 'restore-text' && ui.sheet) { ui.sheet.text = e.target.value; if (ui.sheet.err) { ui.sheet.err = ''; const er = document.querySelector('#restore-text ~ .note.danger'); if (er) er.remove(); } return; }
  if (e.target.id === 'journal-text') { ui.jdraft = e.target.value; return; }
  if (e.target.id === 'qa-text') { ui.qDraft = e.target.value; return; }
  if (e.target.id === 'browse-q') { ui.bq = e.target.value; const l = $('#browseList'); if (l) l.innerHTML = browseList(); return; }
  if (e.target.dataset && e.target.dataset.set === 'name') {
    D.name = e.target.value.slice(0, 30);
    clearTimeout(nameTimer); nameTimer = setTimeout(() => { persist(true); const v = $('#view'); if (ui.tab === 'breathe') renderView(); }, 500);
  }
});

renderView();
Cloud.start();
setTimeout(() => Voice.fetch(), 1200);
setInterval(() => { const ae = document.activeElement; if (ae && /^(TEXTAREA|INPUT)$/.test(ae.tagName)) return; if (!P || !P.on) { if (!sheetEl) renderView(); } }, 5 * 60 * 1000);
})();
</script>
